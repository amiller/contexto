[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contexto"
version = "0.1.0"
description = "Python client for the Contexto context engine (ingest + mindmap search)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ekailabs" }]
dependencies = [
  "httpx>=0.25",
]

[project.urls]
Homepage = "https://github.com/ekailabs/contexto"

[tool.setuptools.packages.find]
where = ["."]
include = ["contexto*"]
